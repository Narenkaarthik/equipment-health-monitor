name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: ./mvnw -B -ntp verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: service/target/site/jacoco

  compose-smoke:
    name: docker compose up and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for health 200
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$code" = "200" ]; then echo "healthy after $i tries"; curl -s http://localhost:8080/actuator/health; exit 0; fi
            sleep 3
          done
          echo "service never became healthy"; docker compose logs service; exit 1
      - name: Container health check (the image's own HEALTHCHECK)
        run: |
          id=$(docker compose ps -q service)
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            echo "health: $s"
            [ "$s" = "healthy" ] && exit 0
            [ "$s" = "unhealthy" ] && { docker inspect --format '{{json .State.Health}}' "$id"; exit 1; }
            sleep 5
          done
          exit 1
      - name: Stop the stack
        if: always()
        run: docker compose down -v
