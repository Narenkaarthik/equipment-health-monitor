services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitor"]
      interval: 5s
      timeout: 3s
      retries: 20

  service:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      MONITOR_DB_URL: jdbc:postgresql://postgres:5432/monitor
      MONITOR_DB_USER: postgres
      MONITOR_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
