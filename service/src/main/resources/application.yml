spring:
  application:
    name: equipment-monitor
  datasource:
    url: ${MONITOR_DB_URL:jdbc:postgresql://localhost:5432/monitor}
    username: ${MONITOR_DB_USER:postgres}
    password: ${MONITOR_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${MONITOR_DB_POOL:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${MONITOR_REDIS_HOST:localhost}
      port: ${MONITOR_REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${MONITOR_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

monitor:
  pipeline: ${MONITOR_PIPELINE:direct}   # direct (stages 1-4) or kafka (stage 5)
  consumer:
    enabled: ${MONITOR_CONSUMER_ENABLED:true}
  kafka:
    partitions: 6
    group: processor
  window:
    size: 30
    store: ${MONITOR_WINDOW_STORE:redis}
  alerts:
    warning-below: 60
    critical-below: 30
    trend-drop: 20
    trend-window: 10
    close-after: 5
    hysteresis: 10

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    dev.eqmon: INFO
