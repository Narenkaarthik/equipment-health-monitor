spring:
  application:
    name: equipment-monitor
  datasource:
    url: ${MONITOR_DB_URL:jdbc:postgresql://localhost:5432/monitor}
    username: ${MONITOR_DB_USER:postgres}
    password: ${MONITOR_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${MONITOR_DB_POOL:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${MONITOR_REDIS_HOST:localhost}
      port: ${MONITOR_REDIS_PORT:6379}

monitor:
  window:
    size: 30
    store: ${MONITOR_WINDOW_STORE:redis}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    dev.eqmon: INFO
